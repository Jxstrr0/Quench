<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#0f1114" />
    <meta name="description" content="Quench: a bladesmithing game. A Longlight Interactive game." />
    <title>Quench</title>
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <style>
      /* Loading screen: inline so it paints on the first frame, before the bundle.
         Driven by src/ui/loading.ts. Adapted from Lombard index.html (11 November 2026).
         This is a studio piece, so it uses the Longlight colours and Space Grotesk. */
      html, body { margin: 0; height: 100%; background: #0f1114; }
      #loading {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
        padding: calc(24px + env(safe-area-inset-top, 0px)) calc(16px + env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) calc(16px + env(safe-area-inset-left, 0px));
        background: #141413;
        color: #faf9f5;
        font-family: 'Space Grotesk', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        transition: opacity 0.4s ease;
      }
      #loading.ld-out { opacity: 0; pointer-events: none; }
      .ld-logo { width: min(260px, 70vw); height: auto; }
      .ld-game { margin: 0; font-size: 15px; font-weight: 500; letter-spacing: 0.08em; color: #b48ce8; }
      .ld-bar { width: min(220px, 60vw); height: 3px; background: rgba(250, 249, 245, 0.15); border-radius: 2px; overflow: hidden; }
      .ld-fill { width: 100%; height: 100%; background: #d97757; transform: scaleX(0.05); transform-origin: left; transition: transform 0.25s ease; }
      .ld-error { max-width: 320px; text-align: center; font-size: 14px; line-height: 1.5; }
      .ld-reload { margin-top: 12px; padding: 10px 18px; border: 0; border-radius: 6px; background: #d97757; color: #141413; font: inherit; font-weight: 700; }
      .ld-copy { position: absolute; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); margin: 0; font-size: 12px; color: rgba(250, 249, 245, 0.6); }
      @media (prefers-reduced-motion: reduce) { #loading, .ld-fill { transition: none; } }
    </style>
  </head>
  <body>
    <div id="loading" role="status" aria-busy="true" aria-label="Loading Quench">
      <img class="ld-logo" src="./brand/longlight-logo-dark.svg" alt="Longlight Interactive" width="1043" height="336" />
      <p class="ld-game">QUENCH</p>
      <div class="ld-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="ld-fill"></div></div>
      <div class="ld-error" hidden>
        <div class="ld-error-text"></div>
        <button class="ld-reload" type="button" onclick="location.reload()">Reload</button>
      </div>
      <p class="ld-copy">&copy; 2026 Kelbo / Longlight Interactive</p>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
